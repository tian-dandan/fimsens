[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fimsens"
version = "0.2.0"
description = "Flood Inundation Mapping toolset: SAR/optical download, raw FIM, commission-error filter, and flood grow/depth estimation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Dan Tian", email = "tiandan.geo@gmail.com" },
]
keywords = ["flood", "SAR", "remote sensing", "inundation", "hydrology", "GIS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]

# Core dependencies (pip-installable)
# NOTE: GDAL/osgeo must be installed separately via conda:
#   conda install -c conda-forge gdal
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-image>=0.19",
    "scikit-learn>=1.1",
    "rasterio>=1.3",
    "geopandas>=0.12",
    "shapely>=2.0",
    "pandas>=1.5",
    "opencv-python-headless>=4.7",
    "tqdm>=4.64",
    "pyproj>=3.4",
]

[project.optional-dependencies]
# Google Earth Engine download tools
gee = [
    "earthengine-api>=0.1.370",
    "geemap>=0.28",
    "ipywidgets>=8.0",
    "ipyleaflet>=0.19",
    "jupyterlab-widgets>=3.0",
]
# Matplotlib visualisation (plot_predict_map)
viz = [
    "matplotlib>=3.6",
]
# Numba JIT backend for regionGrow (much faster on large images)
numba = [
    "numba>=0.57",
]
# Desktop GUI.
# NOTE: the GUI is NOT part of the installed package. It lives in gui/fimsens_gui.py
# in the repository and is run directly (`python gui/fimsens_gui.py`) against an
# installed fimsens. This group exists so you can pull in its Qt dependency:
#   pip install fimsens[gui]
gui = [
    "PyQt6>=6.4",
]
# Install everything that ships inside the package.
# 'gui' is deliberately excluded — see the note above; installing PyQt6 would not
# give you a GUI, because no GUI module is packaged.
all = [
    "fimsens[gee,viz,numba]",
]
# Development tools
dev = [
    "pytest>=7",
    "pytest-cov",
    "black",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/tian-dandan/fimsens"
Repository = "https://github.com/tian-dandan/fimsens"
Issues = "https://github.com/tian-dandan/fimsens/issues"

[tool.hatch.build.targets.wheel]
packages = ["fimsens"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
