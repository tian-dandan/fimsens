# FIMsens conda environment
#
#   conda env create -f environment.yml
#   conda activate fimsens
#   pip install -e . --no-deps
#
# Why conda: fimsens uses GDAL (the `osgeo` module), which pip cannot install
# on its own — PyPI ships no standalone binary wheel, so `pip install gdal`
# tries to compile against a system libgdal that must already be present.
# conda-forge provides prebuilt binaries for GDAL and the whole geospatial
# stack, so everything is installed from there and pip is used only for
# fimsens itself.
#
# Why `--no-deps` on the pip step: every dependency in pyproject.toml is
# already installed below by conda. Without --no-deps, pip would resolve them
# again from PyPI and could shadow the conda builds with incompatible wheels —
# the classic way to end up with two GDAL copies and a segfault.
#
# If you add a dependency to pyproject.toml, add it here too.

name: fimsens
channels:
  - conda-forge
  - nodefaults          # keep the default channel out; mixing it with
                        # conda-forge is a common source of broken geo stacks

dependencies:
  - python=3.11

  # ── Geospatial stack (the reason this file exists) ──────────────────────
  - gdal>=3.6           # provides the `osgeo` module
  - rasterio>=1.3
  - geopandas>=0.12
  - shapely>=2.0
  - pyproj>=3.4

  # ── Scientific core ─────────────────────────────────────────────────────
  - numpy>=1.23
  - scipy>=1.9
  - pandas>=1.5
  - scikit-image>=0.19
  - scikit-learn>=1.1
  - opencv>=4.7
  - tqdm>=4.64

  # ── Optional: faster region grow (fimsens[numba]) ──────────────────────
  - numba>=0.57

  # ── Optional: plotting (fimsens[viz]) ──────────────────────────────────
  - matplotlib>=3.6

  # ── Optional: Google Earth Engine download tools (fimsens[gee]) ────────
  - earthengine-api>=0.1.370
  - geemap>=0.28
  - ipywidgets>=8.0
  - ipyleaflet>=0.19

  # ── Notebook environment for the examples ───────────────────────────────
  - jupyterlab
  - jupyterlab_widgets>=3.0

  - pip

  # Nothing is listed under pip: install fimsens itself after creating the
  # environment, with `pip install -e . --no-deps` (see the header).
